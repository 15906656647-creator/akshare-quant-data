    总市值: {canonical_field: market_cap_cny, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field unit is CNY yuan"}
    流通市值: {canonical_field: float_market_cap_cny, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field unit is CNY yuan"}

  fund_flow:
    日期: {canonical_field: trade_date, data_type: date, mapping_status: mapped, required: true, nullable: false, mapping_evidence: "AKShare documented field"}
    收盘价: {canonical_field: close, data_type: float64, mapping_status: mapped, required: true, nullable: true, mapping_evidence: "AKShare documented field"}
