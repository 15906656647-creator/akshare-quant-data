    超大单净流入-净占比: {canonical_field: super_large_net_inflow_ratio, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field is percent points"}
    大单净流入-净额: {canonical_field: large_net_inflow_cny, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field unit is CNY yuan"}
    大单净流入-净占比: {canonical_field: large_net_inflow_ratio, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field is percent points"}
    中单净流入-净额: {canonical_field: medium_net_inflow_cny, data_type: float64, mapping_status: mapped, required: false, nullable: true, mapping_evidence: "AKShare field unit is CNY yuan"}
