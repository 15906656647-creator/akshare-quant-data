# 来源登记模板（请复制到 dataset.yml 的 sources 列表中使用）
# 正式文件必须放入 sources/ 目录，sha256 使用 Get-FileHash 计算。
sources:
  - file: "sources/<官方文件文件名>"
    document_id: "<官方文件编号>"
    document_date: "<YYYY-MM-DD>"
    source_name: "<官方来源名称>"
    reference: "<官方URL或仓库路径>"
    retrieved_at: "<YYYY-MM-DDTHH:MM:SS+08:00>"
    grade: "A"
    sha256: "<64位小写十六进制>"
    note: "<补充说明>"
